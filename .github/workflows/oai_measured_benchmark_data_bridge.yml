name: oai-measured-benchmark-data-bridge

on:
  push:
    paths:
      - '.github/workflows/oai_measured_benchmark_data_bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public benchmark mirrors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/matheuswhite/narmax/96b0c337e572f10598b42809189014fcdd31ca24/res/snls80.csv' \
            --output data/snls80.csv
          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/matheuswhite/narmax/96b0c337e572f10598b42809189014fcdd31ca24/res/wienerhammer.csv' \
            --output data/wienerhammer.csv
          sha256sum data/snls80.csv data/wienerhammer.csv > data/SHA256SUMS.txt
          wc -l data/snls80.csv data/wienerhammer.csv > data/LINECOUNTS.txt
          head -n 3 data/snls80.csv > data/SNLS_HEAD.txt
          head -n 3 data/wienerhammer.csv > data/WH_HEAD.txt
      - name: Upload benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: measured-benchmark-data
          path: data
          retention-days: 1
          if-no-files-found: error
